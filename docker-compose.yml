services:
  backend:
    build: .
    command: "npm run start"
    working_dir: /usr/src/app  
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/readover-db
    ports: 
      - "3000:3000"
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
