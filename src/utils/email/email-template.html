<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Readover</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="max-width: 600px; margin: 0 auto; padding: 20px"
    >
      <tr>
        <td>
          <!-- Header -->
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="background-color: #2c4156; height: 100px"
          >
            <tr>
              <td
                align="center"
                style="font-size: 24px; color: #ffffff; font-weight: bold"
              >
                READOVER
              </td>
            </tr>
          </table>

          <!-- Conteúdo principal -->
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="margin-top: 20px"
          >
            <tr>
              <td style="font-size: 16px; line-height: 1.6">
                <p style="margin: 0 0 10px 0">Olá,</p>
                {{content}}
              </td>
            </tr>
            <tr>
              <td style="padding-top: 20px">
                <p style="margin: 0">
                  Atenciosamente,<br />
                  <strong>Equipe Readover</strong>
                </p>
              </td>
            </tr>
          </table>

          <!-- Aviso automático -->
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="margin-top: 40px; background-color: #2c4156; height: 50px"
          >
            <tr>
              <td
                align="center"
                style="font-size: 12px; color: #ffffff; font-style: italic"
              >
                Esta é uma mensagem automática. Por favor, não responda a este
                e-mail.
              </td>
            </tr>
          </table>

          <!-- Rodapé -->
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              margin-top: 30px;
              border-top: 1px solid #ecf0f1;
              padding-top: 20px;
            "
          >
            <tr>
              <td align="center" style="font-size: 14px; color: #7f8c8d">
                Este e-mail foi enviado automaticamente. Em caso de dúvidas,
                consulte nossa central de ajuda.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
